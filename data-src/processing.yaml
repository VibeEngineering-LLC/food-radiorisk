# processing.yaml -- влияние кулинарной и технологической обработки на содержание радионуклидов в пище
# Собрано 2026-09-30 (метод sci-search). Отчёт: audit/sci-processing-2026-09-30.md
#
# ВЕЛИЧИНЫ (quantity):
#   Fr -- доля активности сырья, оставшаяся в готовом продукте (0..1; для сушки/варки без потерь = 1)
#   Pe -- выход продукта (масса готового / масса сырья); у записей TRS-472 Pe лежит в полях pe_best/pe_min/pe_max ЭТОЙ ЖЕ записи
#   Pf -- отношение удельных активностей после/до (Бк/кг), Fr = Pf * Pe (TRS-472 разд. 11, ф. 51); Pf > 1 -- удельная активность растёт
#   reduction_factor -- "кратность снижения" из русских источников; если источник не сказал иное, это 1/Pf; к чему отнесена кратность
#                       (Бк/кг или общая активность) -- смотри note каждой записи, там где источник молчит, так и написано
# ПОЛЯ ЗНАЧЕНИЙ: value_best -- точечное значение (для TRS-472 это Ref. value или единственное число в столбце Value);
#   value_min/value_max -- границы диапазона. Одиночное НЕ жирное число в столбце Range таблиц 75/76 записано как min=max при value_best=null.
#   "Производное" значение (пересчитано из "удалено X %" в Fr = 1 - X) помечено в note словом ПРОИЗВОДНОЕ.
# cumulative: true -- значение отсчитано от исходного сырья (накопленное); false -- поэтапное (относительно предыдущего продукта/шага);
#   null -- одна операция либо в источнике не сказано; основание -- в cumulative_basis (для TRS-472) или в note.
# level: ✅ значение прочитано в источнике и сверено скриптом с текстом (для TRS-472 -- с текстовым слоем PDF, стр. отрисованы и сверены глазами);
#   📗 -- не использован; ⚠️ -- расхождение источников, двусмысленная формулировка или сомнительный вторичный источник.
# Дополнительные поля против шаблона задания: pe_best/pe_min/pe_max, cumulative_basis, also_in (соответствие в TECDOC-1616).
# Для TRS-472 nuclide -- ЭЛЕМЕНТ ("Cs", "Sr"), как в таблице; изотопы указаны там, где так сказано в таблице (Cs-137, Sr-90).
