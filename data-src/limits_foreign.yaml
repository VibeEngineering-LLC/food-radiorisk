# ============================ IAEA ============================
- id: iaea_gsr3_food_no_numeric_level
  jurisdiction: IAEA
  document: "IAEA Safety Standards Series No. GSR Part 3, Radiation Protection and Safety of Radiation Sources: International Basic Safety Standards (STI/PUB/1578, Vienna 2014), Requirement 51, paras 5.22-5.23"
  edition: "GSR Part 3 (2014), файл Pub1578_web-57265295.pdf"
  status: "действует"
  nuclides: []
  sum_rule: "Числовых уровней активности (Бк/кг) для продуктов питания в GSR Part 3 нет: para 5.22 -- справочный уровень по годовой эффективной дозе представителя населения, «generally does not exceed a value of about 1 mSv»; para 5.23 отсылает к Codex (уровни для международной торговли после аварии) и к WHO (питьевая вода). Schedule III GSR Part 3 -- это коэффициенты дозы (Sv/Bq), а не уровни для пищи; Schedule I -- изъятие и высвобождение (Бк/г), Schedule IV -- дозовые критерии для аварийного реагирования"
  food_category: "Commodities: food and feed, drinking water, construction materials (existing exposure situations)"
  food_category_ru: "Товары/продукты (пища, корма, питьевая вода, стройматериалы) в существующей ситуации облучения"
  value: null
  unit: "Bq/kg"
  loc: "Requirement 51, paras 5.22-5.23, printed p. 101 (PDF-стр. 131); Schedule III -- Table III.2D (PDF-стр. 254 и след.): dose coefficients (Sv/Bq)"
  url: "https://www-pub.iaea.org/MTCD/Publications/PDF/Pub1578_web-57265295.pdf"
  quote: "5.22. The regulatory body or other relevant authority shall establish specific reference levels for exposure due to radionuclides in commodities such as construction materials, food and feed, and in drinking water, each of which shall typically be expressed as, or be based on, an annual effective dose to the representative person that generally does not exceed a value of about 1 mSv."
  level: "✅"
  retrieved: 2026-09-30

