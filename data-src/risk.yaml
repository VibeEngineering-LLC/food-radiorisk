- {id: nrb2009_p23_potential_exposure_risk_pop, source: NRB2009, quantity: "граничное значение обобщённого риска (потенциальное облучение: вероятность события × вероятность смерти)", population: "население", value: 1.0e-5, unit: "год^-1", loc: "п. 2.3, PDF p.8", quote: "При обосновании защиты от источников потенциального облучения в течение года принимаются следующие граничные значения обобщенного риска (произведение вероятности события, приводящего к облучению, и вероятности смерти, связанной с облучением): - персонал - 2,0×10-4, год-1; - население - 1,0×10-5, год-1.", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_unconditionally_acceptable_risk, source: NRB2009, quantity: "уровень безусловно приемлемого риска", population: "население", value: null, unit: null, loc: "поиск по тексту .doc и PDF complexdoc: слова «безусловно», «приемлем» — 0 совпадений", quote: null, level: "⚠️", status_2026: "в НРБ-99/2009 такого термина/значения не найдено; ближайшее по смыслу — «уровень пренебрежимо малого риска» 10^-6 (п. 2.3). Не приписывать НРБ 10^-6 как «безусловно приемлемый» без стороннего источника"}
- {id: nrb2009_t31_dose_limit_pop, source: NRB2009, quantity: "основной предел эффективной дозы (нормальная эксплуатация техногенных источников)", population: "население", value: 1, unit: "мЗв/год в среднем за любые последовательные 5 лет, но не более 5 мЗв в год", loc: "Таблица 3.1, PDF p.9-10 (значения на p.10); п. 3.1.2", quote: "Эффективная доза ... Население: 1 мЗв в год в среднем за любые последовательные 5 лет, но не более 5 мЗв в год", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_p314_lifetime_dose_pop, source: NRB2009, quantity: "предел эффективной дозы за период жизни", population: "население", value: 70, unit: "мЗв за 70 лет", loc: "п. 3.1.4, PDF p.11", quote: "3.1.4. Эффективная доза для персонала не должна превышать за период трудовой деятельности (50 лет) - 1000 мЗв, а для населения за период жизни (70 лет) - 70 мЗв. Началом периодов считается 1 января 2000 года.", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_p313_scope_limits_exclude, source: NRB2009, quantity: "что не входит в основные пределы доз", population: "население", value: null, unit: null, loc: "п. 3.1.3, PDF p.10", quote: "3.1.3. Основные пределы доз облучения не включают в себя дозы от природного и медицинского облучения, а также дозы вследствие радиационных аварий. На эти виды облучения устанавливаются специальные ограничения.", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_p14_negligible_dose, source: NRB2009, quantity: "уровень пренебрежимо малой (исключения) индивидуальной годовой эффективной дозы — требования Норм не распространяются", population: "любое лицо (население и персонал)", value: 10, unit: "мкЗв/год (при этом коллективная доза не более 1 чел.-Зв)", loc: "п. 1.4, PDF p.6", quote: "1.4. Требования Норм не распространяются на источники излучения, создающие при любых условиях обращения с ними: - индивидуальную годовую эффективную дозу не более 10 мкЗв; и - коллективную эффективную годовую дозу не более 1 чел.-Зв, либо когда при коллективной дозе более 1 чел.-Зв оценка по принципу оптимизации показывает нецелесообразность снижения коллективной дозы;", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_p14_natural_potassium_exclusion, source: NRB2009, quantity: "исключение природного калия из требований Норм", population: "население", value: null, unit: null, loc: "п. 1.4 (последний абзац), PDF p.6", quote: "Требования Норм не распространяются также на космическое излучение на поверхности Земли и внутреннее облучение человека, создаваемое природным калием, на которые практически невозможно влиять.", level: "✅", status_2026: "см. nrb2009_status_2026. Для K-40 в пище: дополнительный K-40 сверх природной смеси нормируется (Прил. 2, сноска *(7))"}
- {id: nrb2009_p521_critical_group, source: NRB2009, quantity: "к чему относятся пределы доз населения", population: "критическая группа населения", value: null, unit: null, loc: "п. 5.2.1, PDF p.14", quote: "5.2.1. Годовая доза облучения населения не должна превышать основные пределы доз (табл. 3.1). Указанные пределы доз относятся к средней дозе критической группы населения, рассматриваемой как сумма доз внешнего облучения за текущий год и ожидаемой дозы до 70 лет вследствие поступления радионуклидов в организм за текущий год.", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_p524_food_basis, source: NRB2009, quantity: "основа расчёта допустимого содержания радионуклидов в пище/воде/воздухе", population: "население", value: 1, unit: "мЗв/год (предел дозы техногенного облучения; далее квоты от него)", loc: "п. 5.2.4, PDF p.14", quote: "5.2.4. Допустимые значения содержания радионуклидов в пищевых продуктах, питьевой воде и воздухе, соответствующие пределу дозы техногенного облучения населения 1 мЗв/год и квотам от этого предела, рассчитываются на основании значений дозовых коэффициентов при поступлении радионуклидов через органы пищеварения с учетом их распределения по компонентам рациона питания и питьевой воде, а также с учетом поступления радионуклидов через органы дыхания и внешнего облучения людей. Значения дозовых коэффициентов для критических групп населения, ДОА и ПГП через органы дыхания и ПГП через органы пищеварения, приведены в Приложении 2.", level: "✅", status_2026: "см. nrb2009_status_2026. Приложение 2: ПГП = 1 мЗв / e (сверено арифметикой по 12 нуклидам)"}
- {id: nrb2009_p531_natural_no_total_limit, source: NRB2009, quantity: "суммарный допустимый предел дозы от природных источников", population: "население", value: null, unit: null, loc: "п. 5.3.1, PDF p.15", quote: "5.3.1. Допустимое значение эффективной дозы, обусловленной суммарным воздействием природных источников излучения, для населения не устанавливается.", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_p86_intervention_note, source: NRB2009, quantity: "уровни вмешательства для радионуклидов в пище не приводятся", population: "население", value: null, unit: null, loc: "п. 8.6(б), PDF p.29 (и .doc, строка 322 txt)", quote: "Уровни вмешательства для радионуклидов в продуктах питания не приводятся и должны определяться по специальным методическим указаниям с учетом местных особенностей внутреннего и внешнего облучения населения - см. п. 5.2.4", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: nrb2009_app4_note_10uSv, source: NRB2009, quantity: "критерий МЗУА/МЗА (Приложение 4): доза при активности ниже таблицы", population: "персонал и население", value: 10, unit: "мкЗв/год (в аварийных случаях 1 мЗв; коллективная — 1 чел.-Зв)", loc: "Приложение 4, примечание, PDF p.207", quote: "При уровнях активности радионуклидов, меньше приведенных в таблице и условии применения МЗУА и МЗА одновременно, эффективная индивидуальная годовая доза облучения лиц из персонала и населения не превысит 10 мкЗв и в аварийных случаях 1 мЗв,", level: "✅", status_2026: "см. nrb2009_status_2026"}
- {id: osporb2010_p3111_10uSv, source: OSPORB2010, quantity: "критерий применения материалов/изделий с техногенными радионуклидами в хозяйственной деятельности", population: "население/любые лица", value: 10, unit: "мкЗв/год (ожидаемая индивидуальная годовая эффективная доза)", loc: "п. 3.11.1, PDF p.26", quote: "Критерием для принятия решения о возможном применении в хозяйственной деятельности сырья, материалов и изделий, содержащих радионуклиды, является ожидаемая индивидуальная годовая эффективная доза облучения, которая при планируемом виде их использования не должна превышать 10 мкЗв.", level: "✅", status_2026: "см. osporb2010_status_2026"}
- {id: osporb2010_p3113_food_excluded, source: OSPORB2010, quantity: "исключение продовольственного сырья/пищи из безусловного освобождения по удельной активности (приложение 3 ОСПОРБ)", population: "население", value: null, unit: null, loc: "п. 3.11.3, PDF p.26", quote: "Не вводится никаких ограничений по радиационной безопасности на использование в хозяйственной деятельности любых твердых материалов, сырья и изделий (кроме продовольственного сырья, пищевой продукции и кормов для животных) при удельной активности техногенных радионуклидов в них менее значений, приведенных в приложении 3 к Правилам", level: "✅", status_2026: "см. osporb2010_status_2026"}
- {id: osporb2010_optimization_negligible, source: OSPORB2010, quantity: "пренебрежимо малый уровень индивидуальной дозы (нижняя граница оптимизации)", population: "население/персонал", value: 10, unit: "мкЗв/год", loc: "Принцип оптимизации, PDF p.43", quote: "В условиях нормальной эксплуатации источника излучения или условий облучения оптимизация (совершенствование защиты) должна осуществляться при уровнях облучения в диапазоне от соответствующих пределов доз до достижения пренебрежимо малого уровня - 10 мкЗв в год индивидуальной дозы.", level: "✅", status_2026: "см. osporb2010_status_2026"}
- {id: osporb2010_p5116_natural_products, source: OSPORB2010, quantity: "эффективная доза населения при использовании в быту материалов без прямых нормативов на природные радионуклиды", population: "население", value: 0.1, unit: "мЗв/год", loc: "п. 5.1.16, PDF p.38", quote: "5.1.16. Использование в коммунальных условиях и быту материалов и изделий, для которых в НРБ-99/2009 и настоящих Правилах не установлены прямые нормативы на содержание природных радионуклидов, допускается, если при использовании ее по назначению эффективная доза облучения населения не превысит 0,1 мЗв/год.", level: "✅", status_2026: "см. osporb2010_status_2026"}
