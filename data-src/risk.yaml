- {id: nrb2009_p23_lifetime_risk_pop, source: NRB2009, quantity: "индивидуальный пожизненный риск, от которого устанавливаются годовые пределы доз (нормальная эксплуатация техногенных источников)", population: "население", value: 5.0e-5, unit: "безразм. (пожизненный риск)", loc: "п. 2.3, PDF p.8", quote: "В условиях нормальной эксплуатации источников ионизирующего излучения пределы доз облучения в течение года устанавливаются исходя из следующих значений индивидуального пожизненного риска: - для персонала – 1,0×10-3; - для населения – 5,0×10-5.", level: "✅", status_2026: "см. nrb2009_status_2026; арифметика: 1 мЗв × 0,05 Зв^-1 = 5×10^-5"}
