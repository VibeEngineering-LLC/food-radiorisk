# --- правила по группе рациона для записей БЕЗ строки норматива в черновике (D-024) ---
group_rules:
  meat:          {norm: [t021_p4_r01_cs137, t021_p4_r01_cs137], decided: *d024, why: "D-024 С1: птица и кролик — Прил. 4 п. 1 «Мясо, мясная продукция»"}
  fish:          {norm: [t021_p4_r03_cs137, t021_p4_r04_cs137], decided: *d024, why: "D-024 С1: морепродукты — Прил. 4 п. 3 «Рыба и рыбные продукты» (сушёные — п. 4)"}
  fish_river:    {norm: [t021_p4_r03_cs137, t021_p4_r04_cs137], decided: *d024, why: "D-024 С1: речная рыба и рак — Прил. 4 п. 3 (сушёные — п. 4)"}
  milk:          {norm: [t021_p4_r05_cs137, t021_p4_r07_cs137], decided: *d024, why: "D-024 С1: сливки и кисломолочные — Прил. 4 п. 5 (сухие — п. 7)"}
  lard:          {norm: [t021_p4_r01_cs137, t021_p4_r01_cs137], decided: *d024, why: "D-024 С2: сало — Прил. 4 п. 1"}
  meat_products: {norm: [t021_p4_r01_cs137, t021_p4_r01_cs137], decided: null, why: "исправление #FR-85: мясное изделие — Прил. 4 п. 1 «мясная продукция», как колбаса; основа «колбас» его не ловила"}
  legumes:       {norm: [t015_grain_pulses_cs137, t015_grain_pulses_cs137], decided: *d024, why: "D-024 С3: бобовые — ТР ТС 015/2011 зернобобовые; документ на зерно, не на пищевой продукт; в показатель B не входит"}
  fruit:         {norm: [null, null], decided: *d024, why: "D-024 С2: садовые фрукты и ягоды — норматив РФ не установлен (в Прил. 4 строки нет); сравнение Codex/EU — по общим нормам"}
  eggs:          {norm: [null, null], decided: *d024, why: "D-024 С2: яйца — норматив РФ не установлен; сравнение Codex/EU — по общим нормам"}

