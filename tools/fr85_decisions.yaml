# fr85_decisions.yaml — решения для перевода черновика products.draft.yaml в словарь data-src/products.yaml (#FR-85 этап 3, D-024).
# Читает tools/fr85_make_products.py. После переноса источник истины — data-src/products.yaml (правится руками); этот файл — запись того, как он получен.
# Ключи записей — name_ru черновика ДОСЛОВНО (с «ё»). Порядок применения: exclude → merge → rename → group_rules → defaults_by_norm → set → add → dry_null.
# why — текст поля note записи; decided — поле decided («оператор …» только для решений D-024; исправления исполнителя — null и пометка в note).

d024: &d024 "оператор 2026-10-09 (D-024)"

